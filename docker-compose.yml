services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doc2meeting}
      POSTGRES_USER: ${POSTGRES_USER:-doc2meeting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doc2meeting}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- FastAPI Backend ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-doc2meeting}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-doc2meeting}
      REDIS_URL: redis://redis:6379/0
      AUDIO_DIR: /app/data/audio
      ROOT_DIR: /app/reviewable
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-}
      OPENAI_EDITOR_MODEL: ${OPENAI_EDITOR_MODEL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?Set SESSION_SECRET_KEY in .env}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost/api/auth/google/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - audio_cache:/app/data/audio
      - reviewable_data:/app/reviewable
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # ---------- Background Worker ----------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-doc2meeting}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-doc2meeting}
      REDIS_URL: redis://redis:6379/0
      AUDIO_DIR: /app/data/audio
      ROOT_DIR: /app/reviewable
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-}
      OPENAI_EDITOR_MODEL: ${OPENAI_EDITOR_MODEL:-}
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - audio_cache:/app/data/audio
      - reviewable_data:/app/reviewable
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------- React Frontend (nginx) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  audio_cache:
    driver: local
  reviewable_data:
    driver: local
