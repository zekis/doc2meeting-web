[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2meeting-web-backend"
version = "0.1.0"
description = "FastAPI backend for the doc2meeting interactive review webapp."
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "openai-agents>=0.17",
    "markitdown[docx]>=0.1",
    "pydub>=0.25",
    "authlib>=1.3,<2",
    "python-jose[cryptography]>=3.3,<4",
    "psycopg2-binary>=2.9,<3",
    "slowapi>=0.1.9,<0.2",
    "httpx>=0.27,<0.28",
    "alembic>=1.13,<2",
    "itsdangerous>=2.1,<3",
    "redis>=5.0,<6",
    "stripe>=8.0,<10",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*"]

